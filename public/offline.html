<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#4338ca" />
  <title>Offline — The Bharath News</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f9fafb;
      color: #111827;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      max-width: 24rem;
      background: #fff;
      border-radius: 1rem;
      padding: 2rem;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
    }
    h1 { font-size: 1.25rem; margin-bottom: .75rem; }
    p { color: #6b7280; line-height: 1.5; margin-bottom: 1.25rem; }
    a {
      display: inline-block;
      background: #4338ca;
      color: #fff;
      text-decoration: none;
      padding: .625rem 1.25rem;
      border-radius: .75rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>You&apos;re offline</h1>
    <p>Check your connection and try again. Cached pages may still be available once you reconnect.</p>
    <a href="/">Retry</a>
  </div>
</body>
</html>
